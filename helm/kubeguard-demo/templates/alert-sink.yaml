{{- if .Values.alertSink.enabled }}
{{- $ctx := dict "name" "alert-sink" "root" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
  labels:
    {{- include "kubeguard-demo.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kubeguard-demo.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubeguard-demo.labels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: alert-sink
          image: "{{ .Values.alertSink.image.repository }}:{{ .Values.alertSink.image.tag }}"
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: LOG_WITHOUT_NEWLINE
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: alert-sink
  labels:
    {{- include "kubeguard-demo.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "kubeguard-demo.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
