{{- if .Values.alertmanager.enabled }}
{{- $ctx := dict "name" "alertmanager" "root" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  labels:
    {{- include "kubeguard-demo.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kubeguard-demo.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubeguard-demo.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/alertmanager-config.yaml") . | sha256sum }}
    spec:
      containers:
        - name: alertmanager
          image: "{{ .Values.alertmanager.image.repository }}:{{ .Values.alertmanager.image.tag }}"
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            # Single instance: no gossip cluster.
            - --cluster.listen-address=
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: data
              mountPath: /alertmanager
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  labels:
    {{- include "kubeguard-demo.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "kubeguard-demo.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 9093
      targetPort: http
{{- end }}
