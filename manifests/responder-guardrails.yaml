# What the responder may change, enforced by Kubernetes independent of its code.
# Apply with: envsubst < manifests/responder-guardrails.yaml | kubectl apply -f -
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kguard-responder
  namespace: ${KGUARD_NAMESPACE}
---
# The only writes in the target namespace: delete pods, patch the one allow-listed Deployment
# (restart, rollback) and create Events (its audit record). No Secrets, no scale, no create.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kguard-responder
  namespace: ${TARGET_NAMESPACE}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["${APP_DEPLOYMENT}"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kguard-responder
  namespace: ${TARGET_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kguard-responder
subjects:
  - kind: ServiceAccount
    name: kguard-responder
    namespace: ${KGUARD_NAMESPACE}
---
# The responder may only delete pods owned by a ReplicaSet of the allowed Deployment.
# Never a StatefulSet pod, a bare pod or any other workload.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kguard-responder-pod-delete
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["DELETE"]
  matchConditions:
    - name: responder
      expression: >-
        request.userInfo.username == 'system:serviceaccount:${KGUARD_NAMESPACE}:kguard-responder'
  variables:
    - name: allowed
      expression: "'${APP_DEPLOYMENT}'"
  validations:
    - expression: >-
        oldObject.metadata.?ownerReferences.orValue([]).exists(o, o.kind == 'ReplicaSet' &&
        o.name.startsWith(variables.allowed + '-') &&
        o.name.substring(size(variables.allowed) + 1).matches('^[a-z0-9]+$'))
      messageExpression: >-
        'The KGuard responder may only delete pods of ' + variables.allowed + ', not ' + oldObject.metadata.name
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kguard-responder-pod-delete
spec:
  policyName: kguard-responder-pod-delete
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ${TARGET_NAMESPACE}
---
# A Deployment patch by the responder may only be a restart (restartedAt annotation) or a rollback
# that keeps the same containers, commands, ServiceAccount and labels, uses images from IMAGE_PREFIX
# and adds no privileged or host access. Replicas, selector and rollout settings never change.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: kguard-responder-deployment-update
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        resources: ["deployments"]
        operations: ["UPDATE"]
  matchConditions:
    - name: responder
      expression: >-
        request.userInfo.username == 'system:serviceaccount:${KGUARD_NAMESPACE}:kguard-responder'
  variables:
    - name: prefix
      expression: "'${IMAGE_PREFIX}'"
    - name: restartKey
      expression: "'kubectl.kubernetes.io/restartedAt'"
    - name: newPod
      expression: object.spec.template
    - name: oldPod
      expression: oldObject.spec.template
    - name: newAnnotations
      expression: variables.newPod.metadata.?annotations.orValue({})
    - name: oldAnnotations
      expression: variables.oldPod.metadata.?annotations.orValue({})
    - name: isRestart
      expression: >-
        variables.newPod.spec == variables.oldPod.spec &&
        variables.newPod.metadata.?labels.orValue({}) == variables.oldPod.metadata.?labels.orValue({}) &&
        variables.newAnnotations.all(k, k == variables.restartKey ||
          (k in variables.oldAnnotations && variables.oldAnnotations[k] == variables.newAnnotations[k])) &&
        variables.oldAnnotations.all(k, k == variables.restartKey || k in variables.newAnnotations)
    - name: sameLabels
      expression: >-
        variables.newPod.metadata.?labels.orValue({}).all(k, k == 'pod-template-hash' ||
          variables.oldPod.metadata.?labels.orValue({})[?k] == optional.of(variables.newPod.metadata.labels[k])) &&
        variables.oldPod.metadata.?labels.orValue({}).all(k, k == 'pod-template-hash' ||
          k in variables.newPod.metadata.?labels.orValue({}))
    - name: isSafeRollback
      expression: >-
        variables.sameLabels &&
        variables.newPod.spec.containers.all(c, c.image.startsWith(variables.prefix) &&
          !c.?securityContext.?privileged.orValue(false) &&
          variables.oldPod.spec.containers.exists(o, o.name == c.name &&
            o.?command.orValue([]) == c.?command.orValue([]) && o.?args.orValue([]) == c.?args.orValue([]))) &&
        variables.newPod.spec.?initContainers.orValue([]) == variables.oldPod.spec.?initContainers.orValue([]) &&
        variables.newPod.spec.?serviceAccountName.orValue('') == variables.oldPod.spec.?serviceAccountName.orValue('') &&
        !variables.newPod.spec.?hostNetwork.orValue(false) &&
        !variables.newPod.spec.?hostPID.orValue(false) &&
        !variables.newPod.spec.?hostIPC.orValue(false) &&
        variables.newPod.spec.?volumes.orValue([]).all(v, !has(v.hostPath))
  validations:
    - expression: >-
        object.spec.?replicas.orValue(1) == oldObject.spec.?replicas.orValue(1) &&
        object.spec.selector == oldObject.spec.selector &&
        object.spec.?strategy.orValue({}) == oldObject.spec.?strategy.orValue({}) &&
        object.spec.?paused.orValue(false) == oldObject.spec.?paused.orValue(false) &&
        object.spec.?minReadySeconds.orValue(0) == oldObject.spec.?minReadySeconds.orValue(0) &&
        object.spec.?revisionHistoryLimit.orValue(10) == oldObject.spec.?revisionHistoryLimit.orValue(10) &&
        object.spec.?progressDeadlineSeconds.orValue(600) == oldObject.spec.?progressDeadlineSeconds.orValue(600)
      message: The KGuard responder may not change replicas, selector, strategy or other rollout settings.
    - expression: variables.isRestart || variables.isSafeRollback
      messageExpression: >-
        'The KGuard responder may only restart ' + object.metadata.name + ' or roll it back to images from ' +
        variables.prefix + ' with the same containers, commands and ServiceAccount'
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: kguard-responder-deployment-update
spec:
  policyName: kguard-responder-deployment-update
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ${TARGET_NAMESPACE}
