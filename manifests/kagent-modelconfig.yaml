# LLM used by the diagnosis agent. Create the Secret kguard-llm (key API_KEY) first.
# Change provider and model to what your cluster may use.
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: kguard-model
  namespace: ${KAGENT_NAMESPACE}
spec:
  provider: OpenAI
  model: gpt-4.1-mini
  apiKeySecret: kguard-llm
  apiKeySecretKey: API_KEY
