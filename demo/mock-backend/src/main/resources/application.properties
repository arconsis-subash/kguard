quarkus.application.name=mock-backend
quarkus.http.port=8080

# Mock traffic: each schedule tick simulates one request per endpoint and calls its downstream stub.
mock.interval=250ms
mock.pricing-url=${MOCK_PRICING_URL:http://localhost:5678/}
mock.inventory-url=${MOCK_INVENTORY_URL:http://localhost:5679/}
mock.connect-timeout=1s
mock.request-timeout=3s
# GET /api/quote reads quote.json from here first (local work that IOChaos can slow down). Empty: no cache read.
mock.cache-dir=${MOCK_CACHE_DIR:}

# OpenTelemetry: traces only, exported via OTLP/gRPC to the OTel Collector. service.name = quarkus.application.name.
quarkus.otel.exporter.otlp.endpoint=${OTEL_COLLECTOR_ENDPOINT:http://localhost:4317}
quarkus.otel.bsp.schedule.delay=1s
quarkus.otel.metrics.enabled=false
quarkus.otel.logs.enabled=false

quarkus.container-image.registry=registry.example.com
quarkus.container-image.group=kguard
quarkus.container-image.name=kubeguard-mock-backend
quarkus.jib.platforms=linux/amd64

# Optional untraced load on the real backend, e.g. http://my-app.my-namespace.svc/api/echo
mock.backend-load.url=${MOCK_BACKEND_LOAD_URL:}
mock.backend-load.interval=1s
