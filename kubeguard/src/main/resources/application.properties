quarkus.application.name=kubeguard
quarkus.http.port=8080
quarkus.log.level=INFO
# The OTel Collector's otlphttp exporter may gzip the body.
quarkus.http.enable-decompression=true
quarkus.http.limits.max-body-size=16M

# ---------------------------------------------------------------------------------------------------------------
# KubeGuard detection. Every value can be overridden with an env var, e.g.
#   kubeguard.rules.downstream-latency.p95-threshold -> KUBEGUARD_RULES_DOWNSTREAM_LATENCY_P95_THRESHOLD
# ---------------------------------------------------------------------------------------------------------------
kubeguard.evaluation-interval=5s
# Only evaluate spans from these service.name values (comma separated). Empty: all services.
#kubeguard.services=mock-backend

# Classification of failed calls, see SpanClassifier. Case-insensitive regular expressions.
kubeguard.ingest.connection-error-pattern=(?i)(connect|i/o error|timed out|timeout|socket|unknown ?host|no ?route ?to ?host|broken pipe)
kubeguard.ingest.jdbc-exception-pattern=(?i)(jdbc|java\\.sql\\.|hibernate|postgresql|agroal)

# Firing durations are longer than the windows on purpose: a short burst of bad calls stays in the window for
# at most one window length, so it can never fire on its own (anti-flapping).

# Downstream latency: p95 of successful CLIENT spans per (service, dependency) above the threshold.
kubeguard.rules.downstream-latency.window=20s
kubeguard.rules.downstream-latency.min-samples=10
kubeguard.rules.downstream-latency.p95-threshold=250ms
kubeguard.rules.downstream-latency.firing-duration=30s
kubeguard.rules.downstream-latency.recovery-duration=30s
kubeguard.rules.downstream-latency.severity=warning

# Service latency: p95 of successful SERVER spans per (service, endpoint), i.e. what the service's callers see.
kubeguard.rules.service-latency.window=20s
kubeguard.rules.service-latency.min-samples=10
kubeguard.rules.service-latency.p95-threshold=250ms
kubeguard.rules.service-latency.firing-duration=30s
kubeguard.rules.service-latency.recovery-duration=30s
kubeguard.rules.service-latency.severity=warning

# Pod crash loop: from pod state (OTLP metrics of the Collector's k8s_cluster receiver), per workload. A current
# container that restarted min-restarts times within the window, or waits in CrashLoopBackOff.
kubeguard.rules.pod-crashloop.window=5m
kubeguard.rules.pod-crashloop.min-samples=1
kubeguard.rules.pod-crashloop.min-restarts=2
kubeguard.rules.pod-crashloop.stale-after=40s
kubeguard.rules.pod-crashloop.firing-duration=30s
kubeguard.rules.pod-crashloop.recovery-duration=60s
kubeguard.rules.pod-crashloop.severity=critical

# Workload unavailable: from pod state, per workload. It has current pods and none of them is ready, so its Service
# has no endpoint. Catches outages the trace rules miss: a pod that is not ready gets no traffic to measure.
kubeguard.rules.pod-unavailable.window=2m
kubeguard.rules.pod-unavailable.min-samples=1
kubeguard.rules.pod-unavailable.stale-after=40s
kubeguard.rules.pod-unavailable.firing-duration=30s
kubeguard.rules.pod-unavailable.recovery-duration=30s
kubeguard.rules.pod-unavailable.severity=critical

# Memory exhaustion predicted: from the JVM heap of each pod (Micrometer metrics, scraped by the Collector's
# prometheus receiver). The heap floor (lowest value per bucket, what stays after garbage collection) rises so that
# the pod will be full within predict-within. It fires before the JVM runs out of memory. Demo timing: a leak of
# about 1 MiB/s fills the backend's ~250 MiB heap in ~4 min and fires after ~1 min (heap scraped every 5s, 40s of
# floors needed); in production window, bucket and predict-within would be closer to 1h, 1m and 30m.
kubeguard.rules.memory-exhaustion.window=1m
kubeguard.rules.memory-exhaustion.min-samples=1
kubeguard.rules.memory-exhaustion.bucket=10s
kubeguard.rules.memory-exhaustion.min-buckets=4
kubeguard.rules.memory-exhaustion.min-fraction=0.25
kubeguard.rules.memory-exhaustion.predict-within=6m
kubeguard.rules.memory-exhaustion.stale-after=40s
kubeguard.rules.memory-exhaustion.firing-duration=15s
kubeguard.rules.memory-exhaustion.recovery-duration=30s
kubeguard.rules.memory-exhaustion.severity=warning

# Pod stuck Pending / Terminating: from the Pod objects (OTLP logs of the Collector's k8sobjects receiver), per
# workload. A current pod Pending for stuck-after since its creation (unschedulable, image not pullable …), or
# Terminating for stuck-after past the end of its grace period (e.g. held by a finalizer). Report only: warning.
kubeguard.rules.pod-pending.window=2m
kubeguard.rules.pod-pending.min-samples=1
kubeguard.rules.pod-pending.stuck-after=60s
kubeguard.rules.pod-pending.stale-after=40s
kubeguard.rules.pod-pending.firing-duration=30s
kubeguard.rules.pod-pending.recovery-duration=30s
kubeguard.rules.pod-pending.severity=warning
kubeguard.rules.pod-terminating.window=2m
kubeguard.rules.pod-terminating.min-samples=1
kubeguard.rules.pod-terminating.stuck-after=60s
kubeguard.rules.pod-terminating.stale-after=40s
kubeguard.rules.pod-terminating.firing-duration=30s
kubeguard.rules.pod-terminating.recovery-duration=30s
kubeguard.rules.pod-terminating.severity=warning

# Dependency connectivity: share of CLIENT spans that failed without any response.
kubeguard.rules.dependency-connectivity.window=20s
kubeguard.rules.dependency-connectivity.min-samples=10
kubeguard.rules.dependency-connectivity.failure-ratio-threshold=0.3
kubeguard.rules.dependency-connectivity.firing-duration=25s
kubeguard.rules.dependency-connectivity.recovery-duration=30s
kubeguard.rules.dependency-connectivity.severity=critical

# ---------------------------------------------------------------------------------------------------------------
# Alertmanager
# ---------------------------------------------------------------------------------------------------------------
kubeguard.alertmanager.enabled=true
quarkus.rest-client.alertmanager.url=${KUBEGUARD_ALERTMANAGER_URL:http://localhost:9093}
quarkus.rest-client.alertmanager.connect-timeout=2000
quarkus.rest-client.alertmanager.read-timeout=5000
kubeguard.alertmanager.resend-interval=30s
kubeguard.alertmanager.alert-ttl=3m
#kubeguard.alertmanager.static-labels.namespace=kubeguard-demo
#kubeguard.alertmanager.generator-url=http://kubeguard.kubeguard-demo:8080/api/incidents

# ---------------------------------------------------------------------------------------------------------------
# Container image (Jib, no Docker daemon needed): ./gradlew build -Dquarkus.container-image.push=true
# ---------------------------------------------------------------------------------------------------------------
quarkus.container-image.registry=registry.example.com
quarkus.container-image.group=kguard
quarkus.container-image.name=kubeguard
quarkus.jib.platforms=linux/amd64

%test.kubeguard.alertmanager.enabled=false
%test.quarkus.scheduler.enabled=false
