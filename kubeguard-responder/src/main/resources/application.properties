quarkus.application.name=kubeguard-responder
quarkus.http.port=8080

# What the responder acts on.
responder.namespace=my-namespace
responder.services=my-app
# Stuck pods: handled for any workload in the namespace (e.g. the bare test pods), diagnosed by the agent and
# always escalated as a GitHub issue. No allowed action fixes a pod that cannot be scheduled or is held by a finalizer.
responder.report-only-alerts=KubeGuardPodStuckPending,KubeGuardPodStuckTerminating
responder.dry-run=false
# Autonomy level per action the policy allows: shadow (only record it and escalate), approve (wait for a human in the
# console, check the policy again, then act) or auto. Unlisted actions stay in shadow mode, so a new installation
# changes nothing until an action is promoted. Env RESPONDER_AUTONOMY, e.g. restart-pod=auto,rollback=approve.
#responder.autonomy=restart-pod=auto,rollout-restart=approve,rollback=approve
responder.approval-timeout=15m
# The fix counts only if KubeGuard resolves the incident within this time after the action.
responder.verify-timeout=4m

# Deterministic gate for the agent's proposal (see ActionPolicy).
responder.policy.allowed-deployments=my-app
responder.policy.min-confidence=medium
responder.policy.cooldown=10m
# At most 3 actions per Deployment within 24h: a fix that keeps coming back goes to a human.
responder.policy.max-actions=3
responder.policy.action-window=24h

# Active alerts are also read from Alertmanager every 30s, so a restarted responder picks up alerts that are
# already firing (Alertmanager does not resend them). Env RESPONDER_ALERTMANAGER_URL.
responder.alertmanager-url=http://alertmanager:9093

# Diagnosis agent (kagent, A2A).
responder.kagent.url=http://kagent-controller.kagent.svc:8083/api/a2a/kagent/kubeguard-incident-agent/
responder.kagent.timeout=4m

# Escalation: GitHub issue. The token (Issues: read and write) comes from RESPONDER_GITHUB_TOKEN.
responder.github.enabled=true
responder.github.repository=my-org/my-repo

quarkus.container-image.registry=registry.example.com
quarkus.container-image.group=kguard
quarkus.container-image.name=kubeguard-responder
quarkus.jib.platforms=linux/amd64

%dev.quarkus.kubernetes-client.devservices.enabled=false
%test.quarkus.kubernetes-client.devservices.enabled=false
%test.responder.github.enabled=false
%test.responder.alertmanager-url=
